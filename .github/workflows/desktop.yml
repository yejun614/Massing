# Builds the desktop app for every platform, and runs the suites on one.
#
# The web app and the Vercel deployment are not built here — Vercel builds
# those itself from `node build.js`, and duplicating it would give two answers
# to what shipped.
name: desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read everywhere by default; the one job that needs to write says so. The
# repository's own default is read-only and is deliberately left that way —
# widening it there would widen it for every workflow, present and future.
permissions:
  contents: read

jobs:
  # Everything that does not need a specific OS, on the cheapest runner.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      # The webview and its build inputs. Tauri needs these on Linux even to
      # compile, not only to run.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm test
      # Through the npm script rather than spelled out again here. Two copies
      # of a lint command drift, and the copy that matters is the one somebody
      # can run before pushing — this failed CI once already because the local
      # side of it did not exist.
      - run: npm run lint:rust
      - run: npm run test:rust
      # `build.js` writes the JSON Schema and the Claude skill from the
      # component registry. A commit that edited the registry and not those is
      # a commit that ships a schema describing a different program.
      - run: npm run build
      - run: git diff --exit-code schema/ .claude/

  # Tagged pushes cut a release; everything else just proves it builds.
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          # `macos-15-intel` rather than `macos-13`: GitHub is winding the
          # Intel runners down, and a `macos-13` job sat unscheduled for a
          # quarter of an hour while every other target finished.
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # Native again, for the same reason as arm64 Linux below: the x86
          # image can cross-compile the Rust, but the WebView2 and NSIS pieces
          # are where cross-builds go wrong and nothing in this matrix would
          # have run the result. Same billing note as the arm64 Linux runner.
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # arm64 Linux on an arm64 runner rather than cross-compiled from
          # x86. Cross-compiling this target means an arm64 cross toolchain
          # *and* arm64 WebKitGTK headers through multiarch, which is a long
          # way to go for a build no machine here has run. These runners are
          # free on public repositories; on a private one they are billed.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    # Creating the release needs write. Without it every job builds for
    # minutes and then fails on the last step with "Resource not accessible by
    # integration", which names no permission and no setting.
    permissions:
      contents: write
    # The signing secrets live on this environment rather than on the
    # repository, so a job that does not name it sees empty strings — which is
    # exactly how this failed the first time. It carries no protection rules,
    # so naming it costs nothing but the line.
    environment: Production
    steps:
      - uses: actions/checkout@v7
      # Every build needs the key, not only a tagged one: `createUpdaterArtifacts`
      # is on, so `tauri build` signs whatever it produces and fails if it
      # cannot. Checked here because the failure it replaces arrives five
      # minutes into a compile and reads
      # "incorrect updater private key password: Missing comment in secret key",
      # which describes neither the password nor the actual problem — an empty
      # secret has no comment line to find.
      #
      # The secret is read through `env` rather than tested in `if`, because
      # the `secrets` context is not available in a step condition — and
      # `shell: bash` because the matrix includes Windows runners, where `run`
      # would otherwise be PowerShell.
      - name: Bundles have to be signed
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty in this job."
            echo "Every bundle is signed for the updater, so no build succeeds without it."
            echo "Either the secret is not set, or it is set somewhere this job cannot"
            echo "see: an environment secret needs 'environment:' on the job."
            echo "  cargo tauri signer generate -w massing.key"
            echo "  gh secret set TAURI_SIGNING_PRIVATE_KEY --env Production < massing.key"
            echo "  gh secret set TAURI_SIGNING_PRIVATE_KEY_PASSWORD --env Production"
            echo "The key file's FIRST LINE is part of it — set the whole file, not"
            echo "just the base64. See docs/DESKTOP.md."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Both Linux runners, not one of them by name: pinning this to
      # `ubuntu-latest` silently skipped the arm64 job, which then failed in
      # the compiler with a missing `webkit2gtk` rather than here.
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Ed25519 key the updater checks. Without these two the bundles
          # still build, but no `.sig` is produced and `latest.json` would
          # describe an update no installed app will accept.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop/src-tauri
          args: --target ${{ matrix.target }}
          # Only on a tag. A release per push to main would be a release
          # nobody asked for, and the updater points at `latest`.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Massing ${{ github.ref_name }}
          releaseDraft: true
          # Off, deliberately. This made each job download the shared
          # `latest.json`, merge its own platform in and upload it back — six
          # jobs read-modify-writing one file. On v0.1.1 two of them lost that
          # race, and the manifest that survived listed four platforms out of
          # six. The `manifest` job below writes it once instead.
          includeUpdaterJson: false
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: massing-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  # `latest.json`, written once, after every bundle is on the release.
  #
  # Its own job rather than a step on one of the six, because "one of the six"
  # is an ordering assumption and this is the file that must not be wrong: a
  # manifest missing a platform is a release that looks complete and silently
  # stops updating whoever is on it.
  manifest:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/updater-manifest.mjs "${{ github.ref_name }}" --write
          gh release upload "${{ github.ref_name }}" latest.json --clobber
