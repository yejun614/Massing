# Builds the desktop app for every platform, and runs the suites on one.
#
# The web app and the Vercel deployment are not built here — Vercel builds
# those itself from `node build.js`, and duplicating it would give two answers
# to what shipped.
name: desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Everything that does not need a specific OS, on the cheapest runner.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      # The webview and its build inputs. Tauri needs these on Linux even to
      # compile, not only to run.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm test
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings
      - run: npm run test:rust
      # `build.js` writes the JSON Schema and the Claude skill from the
      # component registry. A commit that edited the registry and not those is
      # a commit that ships a schema describing a different program.
      - run: npm run build
      - run: git diff --exit-code schema/ .claude/

  # Tagged pushes cut a release; everything else just proves it builds.
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # A tagged build with no key produces bundles and a `latest.json` with no
      # signatures in it, which every installed app then refuses. Failing here
      # costs a minute; not failing is a release that looks fine, gets
      # published, and updates nobody.
      #
      # The secret is read through `env` rather than tested in `if`, because
      # the `secrets` context is not available in a step condition — and
      # `shell: bash` because the matrix includes a Windows runner, where `run`
      # would otherwise be PowerShell.
      - name: A release needs a signing key
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Tagged a release but TAURI_SIGNING_PRIVATE_KEY is not set."
            echo "Generate one with 'cargo tauri signer generate', put the public half"
            echo "in tauri.conf.json and the private half in repository secrets."
            echo "See docs/DESKTOP.md."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Ed25519 key the updater checks. Without these two the bundles
          # still build, but no `.sig` is produced and `latest.json` would
          # describe an update no installed app will accept.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop/src-tauri
          args: --target ${{ matrix.target }}
          # Only on a tag. A release per push to main would be a release
          # nobody asked for, and the updater points at `latest`.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Massing ${{ github.ref_name }}
          releaseDraft: true
          # Writes `latest.json` beside the bundles, with the signature of each
          # one in it. This is the file `tauri.conf.json` points the updater at,
          # and the only reason the release and the updater are connected at all.
          includeUpdaterJson: true
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: massing-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
